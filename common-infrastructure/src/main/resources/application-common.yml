spring:
  application:
    name: ${APP_NAME:dftp-service}
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:25}
      minimum-idle: ${DB_POOL_MIN:5}
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 5000
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration,classpath:db/migration-technical
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3
      properties:
        linger.ms: ${KAFKA_PRODUCER_LINGER_MS:10}
        batch.size: ${KAFKA_PRODUCER_BATCH_SIZE:65536}
        compression.type: ${KAFKA_PRODUCER_COMPRESSION:lz4}
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false
      properties:
        spring.json.trusted.packages: "*"
        max.poll.interval.ms: ${KAFKA_CONSUMER_MAX_POLL_INTERVAL_MS:300000}
        max.poll.records: ${KAFKA_CONSUMER_MAX_POLL_RECORDS:50}
        fetch.min.bytes: 1
        fetch.max.wait.ms: 500
    listener:
      ack-mode: manual_immediate

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    prometheus:
      enabled: true
    health:
      show-details: when_authorized
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db,kafka
  metrics:
    tags:
      application: ${spring.application.name:dftp-service}
  tracing:
    sampling:
      probability: 1.0

logging:
  level:
    root: INFO
    com.dftp: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %5p [${spring.application.name:dftp},traceId=%X{traceId:-},spanId=%X{spanId:-},txId=%X{transactionId:-},corrId=%X{correlationId:-}] [%t] %c{1.} : %m%n"
